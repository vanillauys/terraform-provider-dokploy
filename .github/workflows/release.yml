name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  goreleaser:
    runs-on: ubuntu-latest
    # The write scopes sit on the job, not on the workflow: contents publishes
    # the release, id-token and attestations sign the build provenance
    # attestation of the release archives.
    permissions:
      contents: write
      id-token: write
      attestations: write
    # Every action here is pinned to a full commit SHA, not a moving major-version
    # tag. This job holds the GPG identity the Terraform Registry trusts for the
    # `vanillauys` namespace: anyone who can move a `v6` tag in a third-party
    # repo could otherwise sign releases as us. Update a pin by resolving the
    # tag yourself (`gh api repos/<owner>/<repo>/git/ref/tags/<tag>`) and
    # bumping the trailing comment.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # The GoReleaser binary is pinned too: the action's default is the
          # newest v2 at run time. Dependabot does not move this line; bump it
          # by hand with the action.
          version: v2.18.1
          args: release --clean
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # A signed provenance attestation for every release archive, verifiable
      # with `gh attestation verify <archive> --owner vanillauys`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip
