name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  goreleaser:
    runs-on: ubuntu-latest
    # The write scopes sit on the job, not on the workflow: contents publishes
    # the release, id-token and attestations sign the build provenance
    # attestation of the release archives.
    permissions:
      contents: write
      id-token: write
      attestations: write
    # Every action here is pinned to a full commit SHA, not a moving major-version
    # tag. This job holds the GPG identity the Terraform Registry trusts for the
    # `vanillauys` namespace: anyone who can move a `v6` tag in a third-party
    # repo could otherwise sign releases as us. Update a pin by resolving the
    # tag yourself (`gh api repos/<owner>/<repo>/git/ref/tags/<tag>`) and
    # bumping the trailing comment.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          # The GoReleaser binary is pinned too: the action's default is the
          # newest v2 at run time. Dependabot does not move this line; bump it
          # by hand with the action.
          version: v2.18.1
          args: release --clean
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # A signed provenance attestation for every release archive, verifiable
      # with `gh attestation verify <archive> --owner vanillauys`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip

  # Publishes the Pulumi SDK `pulumi-dokploy` to npm, because SST loads
  # providers only from npm (#126). The SDK holds typed bindings only: at run
  # time Pulumi downloads the signed provider binary from the Terraform Registry.
  # npm trusted publishing (OIDC) authenticates the publish, so no npm token
  # exists. The npm package settings must name this workflow file.
  npm:
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      # SST 4.x runs @pulumi/pulumi 3.215.0. A newer CLI generates SDK code that
      # 3.215.0 cannot run. Bump the version and the sha256 together.
      PULUMI_VERSION: 3.215.0
      PULUMI_SHA256: 0b2616e5602c34fec12f73a5e2d128a756d5cdec7bc7d57787af222c53b488cd
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install the Pulumi CLI
        run: |
          curl -fsSLo "$RUNNER_TEMP/pulumi.tgz" "https://get.pulumi.com/releases/sdk/pulumi-v${PULUMI_VERSION}-linux-x64.tar.gz"
          echo "${PULUMI_SHA256}  $RUNNER_TEMP/pulumi.tgz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/pulumi.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/pulumi" >> "$GITHUB_PATH"
      # `pulumi package add` reads the schema from the Terraform Registry, which
      # lists a new version some minutes after the GitHub release.
      - name: Wait for the Terraform Registry
        run: |
          for _ in $(seq 1 40); do
            if curl -fsS https://registry.terraform.io/v1/providers/vanillauys/dokploy/versions \
              | jq -e --arg v "${VERSION#v}" 'any(.versions[]; .version == $v)' > /dev/null; then
              exit 0
            fi
            sleep 30
          done
          echo "::error::The Terraform Registry does not list ${VERSION#v} after 20 minutes."
          exit 1
      - name: Build the Pulumi SDK
        run: |
          mkdir "$RUNNER_TEMP/gen" && cd "$RUNNER_TEMP/gen"
          printf 'name: dokploy-sdk\nruntime: nodejs\n' > Pulumi.yaml
          echo '{}' > package.json
          pulumi package add terraform-provider registry.terraform.io/vanillauys/dokploy "${VERSION#v}"
          cd sdks/dokploy
          cp "$GITHUB_WORKSPACE/LICENSE" LICENSE
          # The generated postinstall script compiles the sources on install.
          # The package ships compiled code and no scripts/ directory, so drop it.
          jq '.name = "pulumi-dokploy"
            | .repository = {type: "git", url: "git+https://github.com/vanillauys/terraform-provider-dokploy.git"}
            | .files = ["bin/", "README.md", "LICENSE"]
            | del(.scripts.postinstall)' package.json > package.json.new
          mv package.json.new package.json
          sed -i 's#distributed under \[MPL 2.0\](https://www.mozilla.org/en-US/MPL/2.0/)#distributed under the [MIT License](https://github.com/vanillauys/terraform-provider-dokploy/blob/master/LICENSE)#' README.md
          grep -q 'MIT License' README.md
          npm install --no-audit --no-fund
          npm run build
          # getVersion() reads bin/package.json.
          cp package.json bin/package.json
          echo "SDK_DIR=$PWD" >> "$GITHUB_ENV"
      - name: Publish to npm
        working-directory: ${{ env.SDK_DIR }}
        run: npm publish --access public
