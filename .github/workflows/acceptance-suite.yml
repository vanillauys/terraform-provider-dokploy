name: acceptance-suite
# The shared acceptance job, called by acceptance.yml (pull requests) and
# nightly.yml (cron + manual). It exists so a fix to the suite cannot land in
# one caller and silently miss the other — which has happened before.
on:
  workflow_call:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # terraform-plugin-testing downloads a Terraform CLI in every test
      # package through HashiCorp's checkpoint API unless TF_ACC_TERRAFORM_PATH
      # names one. That download timed out on 2026-09-05 (run 33963126885) and
      # failed ten packages in three seconds each before any test ran. One
      # pinned install serves every package and takes the network out of the
      # test binaries. The wrapper is off so the path is the real binary.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.1"
          terraform_wrapper: false
      # Every piped step below sets pipefail explicitly. GitHub's default shell
      # is `bash -e`, which inspects only the LAST command in a pipeline: a
      # failing curl or bootstrap.sh was reported as a green step, and the job
      # went on to run the whole suite with no credentials — surfacing as nine
      # baffling 0.00s test failures instead of "bootstrap failed" (observed
      # for real in nightly run 30190067403).
      - name: Install Dokploy on the runner
        run: |
          set -euo pipefail
          curl -sSL https://dokploy.com/install.sh | sudo bash
      # No separate "wait for Dokploy" step: `GET /` answering is not a
      # readiness signal for the auth stack, which is what we actually need.
      # bootstrap.sh polls that condition itself.
      # Dokploy v0.30.5 waits 45 seconds for a database service to converge
      # and fails the deploy with "did not converge" when the container is
      # still starting. On a fresh runner the image pull eats most of that
      # window: TestAccLibsql_portMatrix failed that way on 2026-09-05 (run
      # 33963429389, attempt 1). Pulling the images the suite deploys before
      # the tests start takes the pull out of the window. The list mirrors the
      # docker_image values in the acceptance tests plus the libsql default.
      - name: Warm the image cache
        run: |
          set -euo pipefail
          pids=()
          for image in traefik/whoami:v1.10 postgres:16-alpine redis:8 mysql:8 mongo:7 mariadb:11.4 ghcr.io/tursodatabase/libsql-server:v0.24.32; do
            docker pull -q "$image" &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do wait "$pid"; done
      - name: Bootstrap admin and API key
        run: |
          set -euo pipefail
          ./acceptance/bootstrap.sh | sed 's/^export //' >> "$GITHUB_ENV"
      - name: Run acceptance tests
        run: TF_ACC_TERRAFORM_PATH="$(command -v terraform)" make testacc
