name: nightly
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # The suite itself lives in acceptance-suite.yml, shared with acceptance.yml
  # so the two can never drift apart. The nightly run exists because up.sh and
  # the CI installer track the latest Dokploy release: a new Dokploy can break
  # us with no change on our side. It runs the suite once per CLI the README
  # promises: the oldest supported Terraform, the latest Terraform, and the
  # latest OpenTofu. The pull request run covers the pinned Terraform only.
  acceptance:
    strategy:
      fail-fast: false
      matrix:
        include:
          - tool: terraform
            version: "1.5.7"
          - tool: terraform
            version: latest
          - tool: opentofu
            version: latest
    uses: ./.github/workflows/acceptance-suite.yml
    with:
      tool: ${{ matrix.tool }}
      version: ${{ matrix.version }}
  # Native Go fuzzing of the two parsers that read input from outside: the
  # .env codec of dokploy_environment_variables and the API error decoder.
  # The unit job runs their seed corpus on every pull request; this job
  # explores new inputs for a minute each.
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./internal/resources/envvars -run='^$' -fuzz=FuzzParseEnv -fuzztime=60s
      - run: go test ./internal/client -run='^$' -fuzz=FuzzAPIError -fuzztime=60s
