name: nightly
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      # Every piped step below sets pipefail explicitly. GitHub's default shell
      # is `bash -e`, which only inspects the LAST command in a pipeline: a
      # failing curl or bootstrap.sh was reported as a green step, and the job
      # went on to run the whole acceptance suite with no credentials. That
      # surfaced as nine baffling 0.00s test failures instead of "bootstrap
      # failed" (observed for real in nightly run 30190067403).
      - name: Install Dokploy latest on the runner
        run: |
          set -euo pipefail
          curl -sSL https://dokploy.com/install.sh | sudo bash
      - name: Wait for Dokploy
        run: |
          for _ in $(seq 1 120); do
            curl -fsS http://localhost:3000 >/dev/null 2>&1 && exit 0
            sleep 2
          done
          exit 1
      - name: Bootstrap admin and API key
        run: |
          set -euo pipefail
          ./acceptance/bootstrap.sh | sed 's/^export //' >> "$GITHUB_ENV"
      - name: Run acceptance tests
        run: make testacc
