# Dependabot keeps the Go modules and the SHA-pinned actions current. An
# action update moves the SHA and its version comment together, so the
# pin policy in release.yml holds.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-modules:
        patterns: ["*"]
    commit-message:
      prefix: "chore"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
