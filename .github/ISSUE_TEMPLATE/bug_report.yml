name: Bug report
description: A resource, a data source, or the provider does not do what the documentation says.
labels: [bug]
body:
  - type: input
    id: provider_version
    attributes:
      label: Provider version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: cli_version
    attributes:
      label: Terraform or OpenTofu version
      placeholder: "Terraform v1.16.1"
    validations:
      required: true
  - type: input
    id: dokploy_version
    attributes:
      label: Dokploy version
      description: Settings > Server in the Dokploy UI.
      placeholder: "v0.30.5"
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Minimal configuration
      description: The smallest configuration that shows the problem. Remove every secret.
      render: hcl
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: The plan or apply output, or the error message.
      render: text
    validations:
      required: true
  - type: textarea
    id: debug
    attributes:
      label: Debug log
      description: The relevant part of the output with `TF_LOG=DEBUG`. Remove the API key and every secret.
      render: text
