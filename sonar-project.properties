# SonarQube Cloud analysis. The `sonar` job in .github/workflows/acceptance.yml
# runs the scanner on every push to master and on every pull request.
sonar.organization=vanillauys
sonar.projectKey=vanillauys_terraform-provider-dokploy

# Every file is a source except the tests and the registry documentation
# tree: docs/ is tfplugindocs output, templates/ feeds it, and examples/ is
# embedded in it. The `*_test.go` files and internal/acctest, the acceptance
# test harness, are tests.
sonar.sources=.
sonar.exclusions=**/*_test.go,internal/acctest/**,docs/**,templates/**,examples/**,coverage/**,coverage.out
sonar.tests=.
sonar.test.inclusions=**/*_test.go,internal/acctest/**

# Coverage counts the provider source only. main.go is the entry point,
# tools/ pins build tools, and dogfood/ holds the import scripts; no test
# covers them.
sonar.coverage.exclusions=main.go,tools/**,dogfood/**

# The `sonar` job merges the coverage data of the acceptance suite and of
# the unit tests into this profile with `go tool covdata textfmt`.
sonar.go.coverage.reportPaths=coverage.out
