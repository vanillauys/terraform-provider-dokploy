# SonarQube Cloud analysis. The `sonar` job in .github/workflows/test.yml
# runs the scanner on every push to master and on every pull request.
sonar.organization=vanillauys
sonar.projectKey=vanillauys_terraform-provider-dokploy

# Every file is a source except the registry documentation tree: docs/ is
# tfplugindocs output, templates/ feeds it, and examples/ is embedded in it.
# The test files move to sonar.tests below.
sonar.sources=.
sonar.exclusions=**/*_test.go,docs/**,templates/**,examples/**,coverage.out
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# The `sonar` job writes this profile with `go test -coverprofile`.
sonar.go.coverage.reportPaths=coverage.out
